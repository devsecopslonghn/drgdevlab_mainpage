server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri $uri/ /index.html;
  }

  # Enable gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml application/octet-stream image/svg+xml;
  gzip_min_length 1024;
}
